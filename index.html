<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="从五天校园故事认识股票，再用互动课程练习选股、读图和买卖计划，在模拟盘检验自己的判断。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="第一股">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/app-192.png">
  <title>今日学习 · 第一股</title>
  <style>@font-face { font-family: Bauhaus93; src: local('Bauhaus 93'), url('https://shuyuanwei4-jpg.github.io/wei-shuyuan-portfolio/assets/Bauhaus93.ttf') format('truetype'); font-display: swap; }
:root {
  --paper: #f7f7f2; --ink: #111; --line: #111; --lime: #b9f227; --blue: #3155f5;
  --accent: var(--blue); --muted: #555550; --panel: #fff; --orange: #ff6b35;
  --cn-display: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', var(--cn-display);
  --display: Bauhaus93, 'Arial Rounded MT Bold', var(--cn-display);
  --type-title: 1.75rem; --type-heading: 1.375rem; --type-body: 1.0625rem; --type-ui: .9375rem; --type-caption: .8125rem;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color: var(--ink); background: var(--paper); font-family: var(--body); font-weight: 400;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #2441dd; outline-offset: 4px; }
[hidden] { display: none !important; }
#content { width: min(1160px, calc(100% - 64px)); flex: 1; margin: 0 auto; padding: 37px 0 38px; outline: none; }
.top { border-bottom: 2px solid var(--line); }
.top-inner { width: min(1280px, calc(100% - 64px)); min-height: 66px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: var(--type-heading); line-height: 1; white-space: nowrap; }
.wordmark small { display: block; margin-top: 3px; font: 12px/1 var(--display); }
.brand-icon { display: flex; gap: 2px; align-items: end; justify-content: center; width: 33px; height: 33px; padding-bottom: 7px; background: var(--lime); border: 2px solid var(--line); border-radius: 0 11px 0 0; }
.brand-icon i { width: 4px; height: 7px; background: var(--ink); }
.brand-icon i:nth-child(2) { height: 11px; }
.brand-icon i:nth-child(3) { height: 16px; }
nav { display: flex; align-items: center; gap: 22px; font-size: var(--type-ui); }
nav a { padding: 11px 1px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a[aria-current], nav a:hover { border-color: currentColor; }
nav a[aria-current] { font-weight: 600; }
.story-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 20px; }
.story-heading > div:first-child { min-width: 0; }
.story-heading .day-display { font: 400 var(--type-heading)/1.1 var(--display); letter-spacing: -.015em; margin: 0 0 10px; white-space: nowrap; }
.day-display .dot { color: var(--blue); }
.story-heading h1, .story-heading h2 { margin: 0; font-size: var(--type-title); font-weight: 600; line-height: 1.28; letter-spacing: normal; }
.step-control { min-width: 130px; color: var(--muted); font-size: var(--type-caption); text-align: right; white-space: nowrap; }
.step-control strong { font-weight: 600; color: var(--ink); }
.segments { display: flex; justify-content: end; gap: 4px; margin-top: 8px; }
.segments i { display: block; width: clamp(18px, 3.2vw, 38px); height: 7px; border: 1px solid var(--line); background: #fff; }
.segments i.visited { background: var(--lime); }
.segments i.active { background: var(--blue); }
.story-stage { display: grid; grid-template-columns: minmax(0, 1.11fr) minmax(0, 1fr); border: 2px solid var(--line); border-radius: 0 46px 0 0; isolation: isolate; overflow: hidden; background: #fff; }
.story-stage.arrive { animation: page-in .42s var(--ease) both; }
.story-art { position: relative; overflow: hidden; min-width: 0; min-height: 410px; margin: 0; display: grid; place-items: center; background-color: var(--art-color, var(--lime)); border-right: 2px solid var(--line); isolation: isolate; }
.story-art::before { content: ''; z-index: -1; position: absolute; inset: 0; background-image: linear-gradient(#1112 1px, transparent 1px), linear-gradient(90deg, #1112 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(130deg, #000, #0000 95%); }
.story-art[data-art='wallet'], .story-art[data-art='phone'] { --art-color: #a7d7ea; }
.story-art[data-art='time'], .story-art[data-art='market'] { --art-color: #8295fe; }
.story-art[data-art='coffee'] { --art-color: #ff865d; }
.story-art[data-art='receipt'] { --art-color: #eeb5d1; }
.art-caption, .art-index { position: absolute; z-index: 2; padding: 4px 8px; font-size: var(--type-caption); font-weight: 600; white-space: nowrap; background: var(--paper); border: 1.5px solid var(--line); }
.art-caption { left: 17px; top: 17px; }
.art-index { right: 19px; bottom: 17px; font-family: var(--display); letter-spacing: .025em; }
.art-shape { position: absolute; font: 35px/1 var(--display); }
.art-shape.one { left: 15%; bottom: 20%; transform: rotate(-14deg); }
.art-shape.two { top: 17%; right: 13%; transform: rotate(19deg); }
.art-objects { position: relative; width: min(75%, 350px); height: 226px; display: grid; place-items: center; }
.art-objects > * { grid-area: 1 / 1; }
.visual-card { position: relative; width: 75%; min-height: 123px; display: grid; align-content: center; gap: 5px; padding: 13px 13px 12px; border: 2px solid var(--line); border-radius: 0 23px 0 0; background: var(--paper); box-shadow: 7px 7px 0 var(--ink); transform: translate(-9%, -11%) rotate(-10deg); }
.visual-card::before { content: ''; position: absolute; inset: 5px; border: 1px solid #1114; border-radius: inherit; pointer-events: none; }
.visual-card span { position: relative; font-size: var(--type-ui); font-weight: 600; }
.visual-card b { position: relative; display: block; font: 400 var(--type-title)/1.1 var(--display); letter-spacing: -.015em; }
.visual-card b.mixed { font: 600 var(--type-title)/1.2 var(--cn-display); letter-spacing: normal; }
.visual-prop { position: relative; justify-self: end; align-self: end; width: 104px; height: 104px; right: 2%; bottom: 7%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--prop, #ff6b35); border-radius: 50%; box-shadow: 5px 5px 0 var(--ink); transform: rotate(12deg); font: 40px/1 var(--display); }
.visual-prop::before { content: ''; position: absolute; inset: 7px; border: 1px dashed var(--ink); border-radius: inherit; }
.art-status { z-index: 3; position: absolute; left: 50%; bottom: 3%; min-width: 96px; max-width: calc(100% - 10px); padding: 7px 12px; border: 2px solid var(--line); background: var(--blue); color: white; box-shadow: 3px 3px 0 var(--ink); font-size: var(--type-ui); font-weight: 600; text-align: center; transform: translateX(-50%) rotate(-4deg); white-space: nowrap; }
.art-status.toss { animation: stamp .6s cubic-bezier(.18, 1.6, .4, 1) both; }
.story-art.changed .visual-prop { animation: prop-toss .65s var(--ease) both; }
.story-art.changed::after { content: ''; position: absolute; z-index: 2; inset: -20%; pointer-events: none; background: linear-gradient(105deg, transparent 39%, #fff5 48%, transparent 58%); animation: light-sweep .72s var(--ease) both; }
.prop-meal { width: 64px; height: 41px; position: relative; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50%; background: #fff; transform: rotate(-7deg); }
.prop-meal::before { content: ''; width: 49px; height: 29px; border: 1.5px solid var(--ink); border-radius: 50%; background: radial-gradient(circle at 33% 50%, #f7eddc 0 23%, transparent 25%), radial-gradient(circle at 65% 36%, #ffcf41 0 26%, transparent 28%), radial-gradient(circle at 63% 67%, #b9f227 0 23%, transparent 25%); }
.prop-coffee { position: relative; width: 44px; height: 50px; border: 2px solid var(--ink); border-radius: 4px 4px 15px 15px; background: #f7f7f2; }
.prop-coffee::before { content: ''; position: absolute; top: 8px; left: 100%; width: 15px; height: 20px; border: 2px solid var(--ink); border-left: 0; border-radius: 0 9px 9px 0; }
.prop-coffee::after { content: ''; position: absolute; top: 20px; left: 12px; width: 14px; height: 14px; background: var(--lime); border: 1.5px solid var(--ink); border-radius: 50%; }
.prop-clock { width: 56px; aspect-ratio: 1; position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; }
.prop-clock::before { content: ''; position: absolute; top: 10px; left: 25px; width: 15px; height: 17px; border-bottom: 3px solid var(--ink); border-left: 3px solid var(--ink); border-radius: 1px; }
.prop-phone { position: relative; width: 36px; height: 61px; border: 2px solid var(--ink); border-radius: 7px; background: var(--paper); }
.prop-phone::before { content: ''; position: absolute; inset: 11px 5px; background: repeating-linear-gradient(to bottom, var(--blue) 0 3px, transparent 3px 8px); }
.prop-phone::after { content: ''; position: absolute; left: 11px; bottom: 3px; width: 10px; height: 2px; background: var(--ink); }
.prop-book { position: relative; width: 49px; height: 38px; border: 2px solid var(--ink); box-shadow: inset 5px 0 #111; background: var(--lime); transform: rotate(-17deg); }
.prop-book::before { content: ''; position: absolute; left: 14px; right: 6px; top: 8px; height: 12px; border-block: 2px solid var(--ink); }
.prop-receipt { position: relative; width: 37px; height: 55px; border: 2px solid var(--ink); background: var(--paper); }
.prop-receipt::before { content: ''; position: absolute; inset: 7px 6px; background: repeating-linear-gradient(to bottom, #111 0 2px, transparent 2px 7px); }
.story-copy { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: clamp(20px, 3.25vw, 47px); }
.scene-title { margin: 0 0 9px; font-size: var(--type-heading); line-height: 1.3; letter-spacing: normal; font-weight: 600; }
.scene-text { margin: 0 0 16px; max-width: 28em; color: #272723; font-size: var(--type-body); line-height: 1.6; }
.choices { display: grid; gap: 8px; }
.choice, .btn { border: 2px solid var(--line); border-radius: 0 14px 0 0; background: var(--paper); color: var(--ink); font-weight: 600; text-align: left; }
.choice { width: 100%; min-height: 49px; display: grid; grid-template-columns: 27px minmax(0, 1fr) 18px; align-items: center; gap: 8px; padding: 8px 11px; font-size: var(--type-ui); line-height: 1.35; }
.choice-key { display: grid; width: 23px; height: 23px; place-items: center; border: 1.5px solid var(--line); border-radius: 50%; font: 15px/1 var(--display); }
.choice span:last-child, .btn span:last-child { transition: transform .31s var(--ease); }
.choice[aria-pressed='true'] { background: var(--lime); box-shadow: 3px 3px 0 var(--ink); }
.choice[aria-pressed='true'] span:last-child { transform: rotate(25deg); }
.feedback { margin: 13px 0 0; padding: 8px 0 8px 11px; border-left: 4px solid var(--blue); font-size: var(--type-ui); line-height: 1.55; }
.scene-next { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 10px; padding: 8px 13px; font-size: var(--type-ui); }
.btn.primary { background: var(--lime); }
.btn.secondary { background: var(--paper); }
.btn:disabled { opacity: .46; }
.story-back { min-height: 43px; padding: 5px 0; border: 0; background: transparent; font-size: var(--type-caption); font-weight: 600; }
.under-stage { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 7px; }
.under-stage span { margin-left: auto; font-size: var(--type-caption); color: var(--muted); }
.course-map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: stretch; }
.course-track { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--panel); border: 2px solid var(--ink); border-radius: 0 28px 0 0; }
.course-track header { padding: 20px 24px; background: var(--lime); border-bottom: 2px solid var(--ink); }
.strategy-track header { background: var(--blue); color: white; }
.course-track header p { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-size: var(--type-ui); }
.course-track header p span { font-size: var(--type-caption); font-variant-numeric: tabular-nums; }
.course-track h2 { margin: 0; font-size: var(--type-heading); line-height: 1.35; font-weight: 600; }
.course-track ul { padding: 0 24px; margin: 0 0 auto; list-style: none; }
.course-track li + li { border-top: 1px solid #deded8; }
.course-track li a { display: grid; align-items: baseline; gap: 4px 12px; padding-block: 15px; font-size: var(--type-body); line-height: 1.4; }
.course-track li a:hover span, .course-track li a:focus-visible span { color: var(--blue); }
.course-track li small { font-size: var(--type-caption); line-height: 1.45; color: var(--muted); }
.course-chapters a { grid-template-columns: 3.5rem minmax(0, 1fr) auto; }
.course-no { color: var(--muted); font: 400 var(--type-ui)/1.4 var(--display); }
.course-groups a { grid-template-columns: 1fr; }
.course-continue { display: flex; min-height: 48px; align-items: center; justify-content: space-between; padding: 10px 24px; font-size: var(--type-ui); font-weight: 600; border-top: 1px solid var(--ink); }
.course-continue:hover { background: var(--paper); }
@media (max-width: 760px) {
  .course-map { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .course-track header { padding: 16px; }
  .course-track ul { padding-inline: 16px; }
  .course-continue { padding-inline: 16px; }
  .course-chapters a { grid-template-columns: 3rem minmax(0, 1fr); }
  .course-chapters small { grid-column: 2; }
}
.site-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; border-top: 2px solid var(--line); width: min(1160px, calc(100% - 64px)); padding: 14px 0 20px; margin: 0 auto; font-size: var(--type-caption); }
.site-footer a { text-decoration: underline; text-underline-offset: 4px; }
.site-footer > span { margin-left: auto; color: var(--muted); }
.resource-card { padding: 16px 0; border-bottom: 1px solid var(--line); }
.resource-card a { text-decoration: underline; text-underline-offset: 5px; }
.resources { max-width: 680px; }
.resources h1 { margin: 0; font-size: var(--type-title); }
#content .sim-shell { --sim-lavender: #ebf6d1; }
#content .sim-card, #content .sim-tip, #content .sim-account { border: 2px solid var(--ink); border-radius: 0 21px 0 0; }
#content .sim-tip { background: var(--lime); color: var(--ink); }
#content .sim-shell .sim-btn { border: 2px solid var(--line); border-radius: 0 13px 0 0; }
#content .sim-shell .sim-btn.primary { color: var(--ink); background: var(--lime); }
#content .sim-shell .sim-btn.primary:hover { background: #d2fb6e; }
#content .sim-account strong { font-family: var(--body); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (hover: hover) {
  .choice, .btn { transition: transform .34s var(--ease), box-shadow .34s var(--ease), background .2s; }
  .choice:hover, .btn:hover:enabled, a.btn:hover { transform: translate(-2px, -3px); box-shadow: 4px 4px var(--ink); }
  .choice:hover span:last-child, a.course-continue:hover > span { transform: translate(2px, -2px); }
  .choice:active, .btn:active { transform: none; box-shadow: none; }
}
@keyframes page-in { from { opacity: .65; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes stamp { from { opacity: 0; transform: translate(-50%, 12px) scale(.65) rotate(15deg); } to { opacity: 1; transform: translate(-50%, 0) scale(1) rotate(-4deg); } }
@keyframes prop-toss { 0%,100% { transform: rotate(12deg); } 52% { transform: translateY(-20px) rotate(30deg); } }
@keyframes light-sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (max-width: 720px) {
  #content, .top-inner, .site-footer { width: calc(100% - 32px); }
  #content { padding: 24px 0 25px; }
  .top-inner { min-height: 58px; }
  .wordmark { font-size: 16px; }
  .wordmark small { font-size: var(--type-caption); }
  nav { gap: 13px; font-size: var(--type-caption); }
  .story-heading { margin-bottom: 12px; gap: 8px; }
  .story-heading .day-display { font-size: var(--type-heading); margin-bottom: 7px; }
  .story-heading h1, .story-heading h2 { font-size: var(--type-title); }
  .step-control { min-width: auto; font-size: var(--type-caption); }
  .segments { margin-top: 4px; }
  .segments i { height: 5px; width: 16px; }
  .story-stage { grid-template-columns: minmax(0, 1fr); border-radius: 0 31px 0 0; }
  .story-art { min-height: 195px; border-right: 0; border-bottom: 2px solid var(--line); }
  .art-caption { left: 9px; top: 8px; font-size: var(--type-caption); }
  .art-index { right: 8px; bottom: 7px; font-size: var(--type-caption); }
  .art-objects { height: 170px; width: min(67%, 252px); }
  .visual-card { min-height: 88px; gap: 3px; box-shadow: 5px 5px var(--ink); }
  .visual-card b { font-size: var(--type-title); }
  .visual-card b.mixed { font-size: var(--type-title); }
  .visual-prop { width: 78px; height: 78px; bottom: 8%; font-size: 31px; }
  .prop-meal, .prop-coffee, .prop-book, .prop-clock, .prop-phone, .prop-receipt { scale: .75; }
  .art-shape { font-size: 23px; }
  .story-copy { padding: 14px 13px; }
  .scene-title { font-size: var(--type-heading); margin-bottom: 5px; }
  .scene-text { margin-bottom: 10px; font-size: var(--type-ui); }
  .choice { min-height: 44px; font-size: var(--type-ui); padding: 6px 8px; }
  .feedback { margin-top: 10px; font-size: var(--type-caption); }
  .scene-next { margin-top: 8px; }
  .scene-next .btn { width: 100%; justify-content: space-between; }
}
@media (max-width: 350px) {
  #content, .top-inner, .site-footer { width: calc(100% - 22px); }
  .site-footer > span { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

.practice {
  --practice-ink: var(--ink, #111);
  --practice-paper: var(--paper, #f7f7f2);
  --practice-blue: var(--blue, #3155f5);
  --practice-lime: var(--lime, #b9f227);
  color: var(--practice-ink);
  width: min(100%, 39rem);
  margin-inline: auto;
}

.practice * { box-sizing: border-box; }
.practice-main { min-width: 0; }
.practice-main h2 {
  color: inherit;
  margin: .45rem 0 .6rem;
  font-size: var(--type-heading);
  line-height: 1.12;
  font-weight: 600;
  letter-spacing: -.025em;
}
.practice-main h2:focus { outline: 0; }
.practice-kicker {
  margin: 0;
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-size: var(--type-caption);
  font-weight: 600;
}
.practice-kicker span { color: var(--muted, #555); font-variant-numeric: tabular-nums; }
.practice-description { margin: 0; font-size: var(--type-body); line-height: 1.65; }
.practice-figure {
  margin: 1.3rem 0 1rem;
  border: 1px solid var(--practice-ink);
  border-top-right-radius: 1.4rem;
  background: var(--practice-paper);
  overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.practice-price-comparison { display: grid; grid-template-columns: 1fr 1fr; }
.practice-price-comparison > div { display: grid; align-content: center; gap: .35rem; min-width: 0; min-height: 6.4rem; padding: .9rem 1.1rem; }
.practice-price-comparison > div + div { background: var(--practice-lime); border-left: 1px solid var(--practice-ink); }
.practice-price-comparison span { font-size: var(--type-caption); font-weight: 600; }
.practice-price-comparison strong { font-size: var(--type-title); line-height: 1.1; }
.practice-price-comparison small { font-family: inherit; font-size: var(--type-caption); white-space: nowrap; }
.practice-ledger { margin: 0; }
.practice-ledger > div { display: flex; justify-content: space-between; align-items: center; gap: .7rem; padding: .63rem 1rem; }
.practice-ledger > div + div { border-top: 1px solid var(--practice-ink); }
.practice-ledger > div:last-child { background: var(--practice-lime); }
.practice-ledger dt { font-size: var(--type-ui); line-height: 1.35; }
.practice-ledger dd { margin: 0; white-space: nowrap; font-size: var(--type-body); font-weight: 600; }
.practice-ledger dd.practice-order-mark { font-size: var(--type-ui); }
.practice-profit { display: grid; grid-template-columns: 1fr 1fr; }
.practice-profit span { display: flex; align-items: center; min-height: 3.6rem; padding: .6rem .8rem; font-size: var(--type-ui); font-weight: 600; background: var(--practice-lime); }
.practice-profit span + span { border-left: 1px solid var(--practice-ink); background: transparent; }
.practice-shares p { margin: 0; padding: .65rem .8rem; border-top: 1px solid var(--practice-ink); font-size: var(--type-ui); }
.practice-message { padding: .95rem 1rem; }
.practice-message span { font-size: var(--type-caption); font-weight: 600; }
.practice-message p { margin: .38rem 0 0; line-height: 1.5; font-size: var(--type-body); }
.practice-actions { display: flex; flex-wrap: wrap; gap: .55rem; }
.practice-choice {
  flex: 1 1 10rem;
  min-height: 2.85rem;
  padding: .5rem .75rem;
  border: 1px solid var(--practice-ink);
  border-radius: 0;
  color: var(--practice-ink);
  background: var(--practice-paper);
  font: inherit;
  font-size: var(--type-ui);
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  cursor: pointer;
}
.practice-choice:hover { background: var(--practice-lime); }

.strategy-lesson-heading { margin: .4rem 0 1.4rem; }

.strategy-sources { color: var(--muted); font-size: var(--type-caption,.8125rem); }

}

  <script>const STORIES = [
  {
    title: '一百块能换来什么',
    label: '认识钱',
    practice: 'money',
    scenes: [
      {
        title: '午饭要不要加杯咖啡？',
        text: '周一中午，小满端着空餐盘，饭卡里刚好有 100 元。身后的室友阿禾指指价目牌：“套餐 15 元，咖啡 10 元。”帮小满点餐，看看明天还能用多少钱。',
        art: 'canteen',
        choices: [
          { label: '拿一份套餐', feedback: '收银机响了一声，扣了 15 元。小满端走一份午饭，卡里还留着 85 元。', value: '饭卡还剩 ¥85' },
          { label: '套餐再加一杯咖啡', feedback: '托盘上多了杯咖啡，小票也多了一行。15 加 10 共花 25 元，卡里还剩 75 元。', value: '饭卡还剩 ¥75' },
        ],
        next: '翻出旧菜单',
      },
      {
        title: '两张菜单，一样的 100 元',
        text: '坐下来，阿禾翻出上学期的菜单照片：“那时套餐一份 15 元。”两人把旧价签盖上，试算每份涨到 18 元时，整整 100 元最多能买几份。',
        art: 'wallet',
        choices: [
          { label: '够买 5 份', feedback: '阿禾摆出五张餐票，共 90 元，剩下 10 元买不了第六份。从能吃六顿变成五顿，同一百元的购买力变小了。', value: '5 顿，还剩 ¥10' },
          { label: '仍然够 6 份', feedback: '小满在第六张餐票旁写下 18 × 6＝108。差 8 元买不了第六份，最多只能拿走五份。', value: '第六顿差 ¥8' },
        ],
        next: '去明信片摊',
      },
      {
        title: '一张还没卖出去的明信片',
        text: '回宿舍路上，阿禾拿出自己画的校门明信片。“印一批还缺 100 元。卖得好，下学期分你 120 元；卖不动，可能只拿回 60 元。”小满想起下周还要吃饭。你会怎么接话？',
        art: 'time',
        choices: [
          { label: '先留足下周饭钱', feedback: '小满把饭卡塞回口袋。饭钱下周就要花，明信片却要下学期才回款。两笔钱赶不上同一顿饭。', value: '下周要用 ¥100' },
          { label: '问清成本、销量和结款时间', feedback: '阿禾翻到印厂报价那一页。卖出多少张能回本，多久能结款，决定了这 100 元要等多久、能拿回多少。', value: '下学期约 ¥60～120' },
          { label: '先把赚到的 20 元记进账本', feedback: '阿禾把还没卖出的那摞样张推过来。这次可能赚 20 元，也可能亏 40 元，小满把“收入”一栏先留空了。', value: '卖不动可能亏 ¥40' },
        ],
        next: '路过下课咖啡',
      },
      {
        title: '一杯咖啡，还是一小份店？',
        text: '两人在校门口停下来。虚构的「下课咖啡」准备开分店，学姐拿出一张股东凭证：“如果出钱认一股，你就拥有这家店的一小部分。”小满看着正在冒热气的咖啡机，先问哪件事？',
        art: 'coffee',
        choices: [
          { label: '一杯能赚多少？客人少了会怎样？', feedback: '学姐掏出进货单。卖咖啡收的钱要先付豆子、工资和房租，剩下多少才关系到股东能分享什么。经营不顺，出的钱也可能亏掉。', value: '先算一杯的成本' },

      {

  <script>// 上证综合指数（000001），腾讯证券日线。原字段为日期、开、收、高、低、成交量（手）。
const HISTORICAL_SOURCE = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh000001,day,2024-09-02,2024-09-30,30,qfq';
const HISTORICAL_INDEX = [
  ['09-02', 281104, 340714193], ['09-03', 280298, 275736139], ['09-04', 278428, 257453500],
  ['09-05', 278831, 242040948], ['09-06', 276581, 253645375], ['09-09', 273649, 261468847],
  ['09-10', 274419, 262159015], ['09-11', 272180, 242264900], ['09-12', 271712, 240084315],
  ['09-13', 270409, 251270038], ['09-18', 271728, 247817132], ['09-19', 273602, 315208389],
  ['09-20', 273681, 285644627], ['09-23', 274892, 257642154], ['09-24', 286313, 477619545],
  ['09-25', 289631, 568259816], ['09-26', 300095, 576319261], ['09-27', 308753, 492287163],
  ['09-30', 333650, 1102337917],
].map(([time, last, volume]) => ({ time, last, volume }));

function tradingTime(tick) {
  const minutes = 570 + tick * 5 + (tick > 24 ? 90 : 0);
  return [Math.floor(minutes / 60), minutes % 60].map(n => String(n).padStart(2, '0')).join(':');
}

function makeMarketSession(day, previousClose) {
  // 固定首日上午的走势，与第四天课程的第一笔限价单共用同一份报价。
  const firstMorning = [998, 1000, 1002, 1004, 1003, 1005, 1004, 1003, 1000, 999, 1000, 1002, 1001, 998];
  let seed = (day * 2654435761) >>> 0;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  let last = previousClose;
  return Array.from({ length: 49 }, (_, tick) => {
    const opening = tick === 0;
    const flow = 0.3 * Math.sin(day + tick / 5);
    const volatility = opening ? 0.012 : 0.0045;
    const move = previousClose * volatility * (random() * 2 - 1 + flow);
    const prior = last;
    last = day === 1 && tick < firstMorning.length ? firstMorning[tick] : Math.max(5, Math.min(99990, last + Math.round(move)));
    const spread = random() < 0.2 ? 2 : 1;
    const activeSession = 1 + 2 * Math.pow(Math.abs(tick - 24) / 24, 2);
    // Simulated volume is measured in shares, including the opening auction at 09:30.
    const volume = Math.round((8 + random() * 46 + Math.abs(last - prior) * 2) * activeSession) * 100;
    return { time: tradingTime(tick), last, volume, high: last, low: last,
      bid: last - 1, ask: last + (day === 1 && (tick === 12 || tick === 13) ? 1 : spread) };
  });
}

function renderMarketChart(container, account, historical) {
  const points = historical ? HISTORICAL_INDEX : account.history;
  const values = points.map(point => point.last);
  if (!historical) values.push(account.previousClose);
  const padding = Math.max(1, Math.ceil((Math.max(...values) - Math.min(...values)) * 0.12));
  const top = Math.max(...values) + padding;
  const bottom = Math.min(...values) - padding;
  const maxVolume = Math.max(...points.map(point => point.volume));
  const count = points.length;
  const x = index => 5 + 490 * index / Math.max(1, count - 1);
  const y = value => 5 + 106 * (top - value) / (top - bottom);
  const line = points.map((point, i) => `${x(i).toFixed(1)},${y(point.last).toFixed(1)}`).join(' ');
  const barWidth = Math.min(12, 300 / count);
  const bars = points.map((point, i) => {
    const height = point.volume / maxVolume * 30;
    return `<rect x="${x(i) - barWidth / 2}" y="${154 - height}" width="${barWidth}" height="${height}"/>`;
  }).join('');
  const lastPoint = count - 1;
  const firstLabel = points[0].time;
  const centerLabel = count >= 3 ? points[Math.floor(lastPoint / 2)].time : '';
  const lastLabel = count > 1 ? points[lastPoint].time : '';
  const title = historical ? '上证指数 · 2024 年 9 月' : '下课咖啡 · 当日分时';
  container.innerHTML = `
    <div class="market-chart-switch" role="group" aria-label="选择行情图">
      <button type="button" data-chart-mode="sim" aria-pressed="${!historical}">模拟分时</button>
      <button type="button" data-chart-mode="index" aria-pressed="${historical}">上证历史</button>
    </div>
    <div class="market-chart-title"><h3>${title}</h3><span>${historical ? '每日收盘 / 点' : '成交价 / 元'}</span></div>
    <div class="market-chart-plot">
      <div class="market-chart-scale" aria-hidden="true"><span>${simNumber(top)}</span><span>${simNumber((top + bottom) / 2)}</span><span>${simNumber(bottom)}</span></div>
      <svg data-chart-plot viewBox="0 0 500 158" preserveAspectRatio="none" aria-hidden="true">
        <path class="market-gridline" d="M0 5H500 M0 58H500 M0 111H500 M0 154H500"/>
        ${historical ? '' : `<path class="market-baseline" d="M0 ${y(account.previousClose)}H500"/>`}
        <polygon class="market-fill" points="${x(0)},111 ${line} ${x(lastPoint)},111"/>
        <polyline class="market-line" points="${line}"/>
        <g class="market-volume">${bars}</g>
        <line class="market-cross" y1="2" y2="154"/>
        <circle class="market-point" r="3.5"/>
      </svg>
      <div class="market-time-scale" aria-hidden="true"><span>${firstLabel}</span><span>${centerLabel}</span><span>${lastLabel}</span></div>
    </div>
    <div class="market-reading"><span data-chart-reading></span><span data-chart-volume></span></div>
    <input class="market-scrubber" type="range" min="0" max="${lastPoint}" value="${lastPoint}" step="1" aria-label="${historical ? '选择交易日' : '选择分时时刻'}" ${count === 1 ? 'disabled' : ''}>
    <p class="market-chart-note">${historical ? `收盘点位与每日成交量，数据来自<a href="${HISTORICAL_SOURCE}" target="_blank" rel="noopener noreferrer">腾讯证券</a>。此图仅供读盘。` : '蓝线是成交价，虚线是昨收，灰柱是每段成交量。拖动滑块可逐点查看。'}</p>`;
  const scrubber = container.querySelector('.market-scrubber');
  const plot = container.querySelector('[data-chart-plot]');
  const cross = plot.querySelector('.market-cross');
  const marker = plot.querySelector('.market-point');
  function inspect(index) {
    const point = points[index];
    const xPosition = x(index);
    cross.setAttribute('x1', xPosition);
    cross.setAttribute('x2', xPosition);
    marker.setAttribute('cx', xPosition);
    marker.setAttribute('cy', y(point.last));
    const priceText = historical ? `${simNumber(point.last)} 点` : simMoney(point.last);
    const volumeText = historical ? `${(point.volume / 1e8).toFixed(2)} 亿手` : `${point.volume.toLocaleString('zh-CN')} 股`;
    container.querySelector('[data-chart-reading]').textContent = `${point.time}　${priceText}`;
    container.querySelector('[data-chart-volume]').textContent = `成交量 ${volumeText}`;
    scrubber.value = index;
    scrubber.setAttribute('aria-valuetext', `${point.time}，${priceText}，成交量 ${volumeText}`);
  }
  scrubber.addEventListener('input', () => inspect(Number(scrubber.value)));
  plot.addEventListener('click', event => {
    const bounds = plot.getBoundingClientRect();
    const position = ((event.clientX - bounds.left) / bounds.width * 500 - 5) / 490;
    inspect(Math.min(lastPoint, Math.max(0, Math.round(position * lastPoint))));
  });
  inspect(lastPoint);
}

function simFee(side, amount) {
  const commission = Math.max(500, Math.round(amount * 0.0003));
  const tax = side === 'sell' ? Math.round(amount * 0.0005) : 0;
  return commission + tax;
}

class SimTradingAccount {
  constructor(budget) {
    this.startingCash = Math.round(budget * 100);
    this.cash = this.startingCash;
    this.shares = 0;
    this.boughtToday = 0;
    this.day = 1;
    this.tick = 12;
    this.previousClose = 1000;
    this.session = makeMarketSession(this.day, this.previousClose);
    this.orders = [];
  }

  get quote() {
    return this.session[this.tick];
  }

  get last() {
    return this.quote.last;
  }

  get history() {
    return this.session.slice(0, this.tick + 1);
  }

  get closed() {
    return this.tick === this.session.length - 1;
  }

  get pending() {
    return this.orders.filter(order => order.status === 'pending');
  }

  get available() {
    const held = this.pending
      .filter(order => order.side === 'buy')
      .reduce((sum, order) => sum + order.amount + order.fee, 0);
    return this.cash - held;
  }

  get sellable() {
    const held = this.pending
      .filter(order => order.side === 'sell')
      .reduce((sum, order) => sum + order.quantity, 0);
    return this.shares - this.boughtToday - held;
  }

  submit(side, limit, quantity) {
    if (this.closed) return { reason: '今天已经收盘。进入下一交易日后可以继续委托。' };
    if (!Number.isInteger(limit) || limit < 1 || limit > 99999) {
      return { reason: '输入 0.01 至 999.99 元的价格，最多保留两位小数。' };
    }
    if (!Number.isInteger(quantity) || quantity < 100 || quantity % 100 !== 0 || quantity > 10000) {
      return { reason: '数量从 100 股起，每次增加 100 股，本练习单笔最多 10,000 股。' };
    }
    const amount = limit * quantity;
    const fee = simFee(side, amount);
    if (side === 'buy' && amount + fee > this.available) {
      return { reason: '可用资金不足。买入委托需要覆盖限价金额和预计费用。' };
    }
    if (side === 'sell' && quantity > this.sellable) {
      const reason = this.boughtToday > 0
        ? '可卖股数不足。今天买入的股票到下一交易日才可卖。'
        : '可卖股数不足。先查看持仓，或撤销占用股数的卖单。';
      return { reason };
    }
    const order = {
      id: this.orders.length + 1, day: this.day, side, limit, quantity, amount, fee, status: 'pending'
    };
    this.orders.push(order);
    this.match(order);
    return { order };
  }

  match(order) {
    const isBuy = order.side === 'buy';
    const price = isBuy ? this.quote.ask : this.quote.bid;
    const crosses = isBuy ? order.limit >= price : order.limit <= price;
    if (!crosses) return false;
    const amount = price * order.quantity;
    const fee = simFee(order.side, amount);
    if (isBuy) {
      this.cash -= amount + fee;
      this.shares += order.quantity;
      this.boughtToday += order.quantity;
    } else {
      this.cash += amount - fee;
      this.shares -= order.quantity;
    }
    const point = this.quote;
    point.last = price;
    point.low = Math.min(point.low, price);
    point.high = Math.max(point.high, price);
    point.volume += order.quantity;
    Object.assign(order, { price, amount, fee, status: 'filled' });
    return true;
  }

  cancel(id) {
    const order = this.pending.find(item => item.id === id);
    if (order) order.status = 'canceled';
    return order;
  }

  advance() {
    if (this.closed) return { filled: [], expired: [] };
    this.tick += 1;
    const filled = [];
    for (const side of ['buy', 'sell']) {
      const orders = this.pending.filter(order => order.side === side);
      orders.sort((a, b) => (side === 'buy' ? b.limit - a.limit : a.limit - b.limit) || a.id - b.id);
      for (const order of orders) {
        if (this.match(order)) filled.push(order);
      }
    }
    const expired = this.closed ? this.pending : [];
    for (const order of expired) order.status = 'expired';
    return { filled, expired };
  }

  nextDay() {
    const filled = [];
    let expired = [];
    while (!this.closed) {
      const step = this.advance();
      filled.push(...step.filled);
      expired = step.expired;
    }
    this.previousClose = this.last;
    this.boughtToday = 0;
    this.day += 1;
    this.tick = 0;
    this.session = makeMarketSession(this.day, this.previousClose);
    return { filled, expired };
  }
}

const SIM_FORMAT = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const simNumber = cents => SIM_FORMAT.format(cents / 100);
const simMoney = cents => `¥${simNumber(cents)}`;
const simSide = side => side === 'buy' ? '买入' : '卖出';
const SIM_ORDER_STATUS = { pending: '待成交', filled: '已成交', canceled: '已撤单', expired: '已失效' };
let simAccount;

function renderSimulator(root, budget = 8000) {
  if (!simAccount) {
    const chosenBudget = Number.isFinite(budget) ? Math.max(0, Math.min(10000, budget)) : 8000;
    simAccount = new SimTradingAccount(chosenBudget);
  }
  let side = 'buy';
  let price = '';
  let quantity = '100';
  let status = '';
  let error = false;
  let historical = false;
  let playTimer = null;
  root.innerHTML = `<style>${SIMULATOR_CSS}</style><div class="sim-shell"><div class="sim-live" aria-live="polite" aria-atomic="true"></div><div class="sim-content"></div></div>`;
  const view = root.querySelector('.sim-content');
  const live = root.querySelector('.sim-live');

  function pausePlayback() {
    clearInterval(playTimer);
    playTimer = null;
    document.removeEventListener('visibilitychange', pauseWhenHidden);
    const button = view.querySelector('[data-market-play]');
    if (button) {
      button.textContent = '播放行情';
      button.setAttribute('aria-pressed', 'false');
    }
  }

  function pauseWhenHidden() {
    if (document.hidden) pausePlayback();
  }

  function setStatus(text, isError = false) {
    status = text;
    error = isError;
    live.textContent = text;
  }

  function selectedPrice() {
    return /^\d{1,3}(?:\.\d{1,2})?$/.test(price) ? Math.round(Number(price) * 100) : 0;
  }

  function updateEstimate() {
    const limit = selectedPrice();
    const count = Number(quantity);
    const estimate = view.querySelector('.sim-estimate');
    if (!limit || count < 100 || count > 10000 || count % 100 !== 0) {
      estimate.innerHTML = '<span>按限价试算</span><strong>—</strong>';
      return;
    }
    const value = limit * count;
    const fee = simFee(side, value);
    const total = side === 'buy' ? value + fee : value - fee;
    const totalLabel = side === 'buy' ? '预计扣款上限' : '预计到账下限';
    estimate.innerHTML = `<span>${totalLabel} <small>含费用 ${simMoney(fee)}</small></span><strong>${simMoney(total)}</strong>`;
  }

  function render(focusSelector) {
    const account = simAccount;
    const { ask, bid, time } = account.quote;
    const prices = account.history;
    const change = account.last - account.previousClose;
    const sign = change < 0 ? '−' : change > 0 ? '+' : '';
    const openDetails = [...view.querySelectorAll('.sim-foot details')].map(item => item.open);
    const marketValue = account.shares * account.last;
    const assets = account.cash + marketValue;
    const profit = assets - account.startingCash;
    const signedProfit = profit > 0 ? `+${simMoney(profit)}` : profit < 0 ? `−${simMoney(-profit)}` : simMoney(0);
    const actionTitle = side === 'buy' ? '最高愿付的价格' : '最低愿收的价格';
    const orders = account.orders.slice().reverse();
    const rows = orders.map(order => `<tr>
      <td>第 ${order.day} 日</td><td>${simSide(order.side)}</td><td>${simMoney(order.limit)}</td><td>${order.quantity} 股</td>
      <td>${order.price ? simMoney(order.price) : '—'}</td><td>${order.status === 'filled' ? simMoney(order.fee) : '—'}</td>
      <td><span class="sim-order-state ${order.status}">${SIM_ORDER_STATUS[order.status]}</span></td>
      <td>${order.status === 'pending' ? `<button type="button" class="sim-link" data-cancel="${order.id}" aria-label="撤销第 ${order.id} 笔${simSide(order.side)}委托">撤单</button>` : '—'}</td>
    </tr>`).join('');
    view.innerHTML = `
      <header class="sim-header">
        <div><h1>模拟交易</h1><p>用虚拟资金练习看盘、挂单、成交和撤单。</p></div>
        <div class="market-header-actions"><span class="sim-day">第 ${account.day} 日　${time}</span><button type="button" class="sim-tour-replay" data-tour-open>新手引导</button></div>
      </header>
      <div class="sim-account">
        <div><span>总资产</span><strong>${simMoney(assets)}</strong><small>现金 + 持仓市值</small></div>
        <div><span>可用资金</span><strong>${simMoney(account.available)}</strong><small>冻结 ${simMoney(account.cash - account.available)}</small></div>
        <div><span>持有股数</span><strong>${account.shares} <small>股</small></strong><small>当前可卖 ${account.sellable} 股</small></div>
        <div><span>账户盈亏</span><strong class="${profit < 0 ? 'sim-down' : profit > 0 ? 'sim-up' : ''}">${signedProfit}</strong><small>初始资金 ${simMoney(account.startingCash)}</small></div>
      </div>
      ${account.day === 1 && account.tick === 12 && account.orders.length === 0 ? '<aside class="sim-tip"><div><strong>练习第一笔限价单</strong><p>报 ¥10.00 买入 100 股，先看看委托为什么会等待，再前进 5 分钟。</p></div><button type="button" class="btn secondary sim-btn" data-example>填入示例</button></aside>' : ''}
      <div class="sim-market-grid">
        <section class="sim-card sim-market" aria-labelledby="sim-stock-title">
          <div class="market-ident"><div class="sim-stock-head"><span class="sim-stock-symbol" aria-hidden="true"></span><div><h2 id="sim-stock-title">下课咖啡</h2><span>SIM001 · 虚构股票</span></div></div>
          <div class="market-last"><span>最新成交价</span><strong>${simMoney(account.last)}</strong><span class="market-change ${change < 0 ? 'fall' : change > 0 ? 'rise' : ''}">较昨收 ${sign}${simNumber(Math.abs(change))}（${sign}${(Math.abs(change) / account.previousClose * 100).toFixed(2)}%）</span></div></div>
          <dl class="market-stats">
            <div><dt>昨收</dt><dd>${simNumber(account.previousClose)}</dd></div>
            <div><dt>最高</dt><dd>${simNumber(Math.max(...prices.map(p => p.high)))}</dd></div>
            <div><dt>最低</dt><dd>${simNumber(Math.min(...prices.map(p => p.low)))}</dd></div>
            <div><dt>总量（手）</dt><dd>${(prices.reduce((sum, point) => sum + point.volume, 0) / 100).toLocaleString('zh-CN')}</dd></div>
          </dl>
          <section class="sim-chart" aria-label="交互行情图"></section>
          <p class="sim-quotes-label" id="sim-quotes-label">${account.closed ? '下课咖啡 · 收盘前最后报价' : '下课咖啡 · 当前报价'}</p>
          <div class="sim-quotes" role="group" aria-labelledby="sim-quotes-label">
            <button type="button" data-quote="${ask}" aria-label="把卖一 ${simNumber(ask)} 元填入限价"><span>卖一 <small>最低卖价</small></span><strong>${simMoney(ask)}</strong></button>
            <button type="button" data-quote="${bid}" aria-label="把买一 ${simNumber(bid)} 元填入限价"><span>买一 <small>最高买价</small></span><strong>${simMoney(bid)}</strong></button>
          </div>
          <p class="sim-quotes-note">点报价可填入限价。${account.closed ? '本日已收盘。' : '每步推进 5 个交易分钟，午休自动跳过。'}</p>
          <div class="sim-market-actions">
            <button type="button" class="btn secondary sim-btn" data-market-play aria-pressed="${playTimer !== null}" ${account.closed ? 'disabled' : ''}>${playTimer !== null ? '暂停播放' : '播放行情'}</button>
            <button type="button" class="btn secondary sim-btn" data-step="tick" ${account.closed ? 'disabled' : ''}>前进 5 分钟</button>
            <button type="button" class="btn secondary sim-btn" data-step="day">下一交易日</button>
          </div>
        </section>
        <section class="sim-card sim-ticket" aria-labelledby="sim-ticket-title">
          <div class="sim-ticket-head"><h2 id="sim-ticket-title">限价委托</h2><span>每手 100 股</span></div>
          <p class="market-order-symbol">下课咖啡 · SIM001</p>
          <div class="sim-toggle" role="group" aria-label="交易方向">
            <button type="button" data-side="buy" aria-pressed="${side === 'buy'}">买入</button>
            <button type="button" data-side="sell" aria-pressed="${side === 'sell'}">卖出</button>
          </div>
          <form class="sim-form" data-order-form novalidate>
            <div class="sim-inputs">
              <label><span>限价（元 / 股）</span><input name="limit" value="${price}" type="number" inputmode="decimal" min="0.01" max="999.99" step="0.01" placeholder="${simNumber(side === 'buy' ? ask : bid)}" required><small>${actionTitle}</small></label>
              <label><span>数量（股）</span><input name="quantity" value="${quantity}" type="number" inputmode="numeric" min="100" max="10000" step="100" required><small>按 100 股递增</small></label>
            </div>
            <div class="sim-estimate"></div>
            <button class="btn primary sim-btn sim-submit" type="submit" ${account.closed ? 'disabled' : ''}>${account.closed ? '已收盘' : '提交' + simSide(side) + '委托'}</button>
          </form>
          ${status ? `<p class="sim-status${error ? ' sim-status-error' : ''}">${status}</p>` : ''}
        </section>
      </div>
      <section class="sim-card sim-history" aria-labelledby="sim-history-title">
        <div class="sim-ticket-head"><h2 id="sim-history-title">委托与成交</h2><span>${account.pending.length} 笔待成交</span></div>
        ${rows ? `<div class="sim-table-scroll" tabindex="0" aria-label="订单记录表格，可横向滚动"><table><thead><tr><th scope="col">委托日</th><th scope="col">方向</th><th scope="col">限价</th><th scope="col">数量</th><th scope="col">成交价</th><th scope="col">费用</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sim-empty">提交一笔委托后，这里会显示状态和成交价格。</p>'}
      </section>
      <div class="sim-foot">
        <details><summary>模拟规则与费用</summary><p>虚构股票按五分钟更新成交价和成交量。9:30 的量为开盘成交量。只模拟最优一档，假设对手方数量充足，满足限价时按对手方报价一次成交。同方向按价格优先、同价按时间优先处理。跳到下一日会先走完当日行情，收盘后剩余委托失效，当天买入的股数到下一交易日可卖。练习简化了集合竞价、涨跌幅和申报范围等规则。</p><p>示例佣金为成交额的 0.03%，每笔最低 ¥5。卖出额外计 0.05% 的印花税，模拟省略过户费。实盘费用以当期规则和券商公示为准。刷新页面会重置本次模拟记录。</p></details>
        <details class="sim-reset"><summary>重置模拟资金</summary><form data-reset-form><label for="sim-budget">初始虚拟资金（0–10,000 元）</label><div><input id="sim-budget" name="budget" type="number" min="0" max="10000" step="1" value="${Math.trunc(account.startingCash / 100)}" required><button class="btn secondary sim-btn" type="submit">重置并开始</button></div><p>将清空当前持仓、委托和成交记录。</p></form></details>
      </div>`;
    renderMarketChart(view.querySelector('.sim-chart'), account, historical);
    view.querySelectorAll('.sim-foot details').forEach((item, index) => { item.open = Boolean(openDetails[index]); });
    updateEstimate();
    if (focusSelector) view.querySelector(focusSelector)?.focus({ preventScroll: true });
  }

  view.addEventListener('input', event => {
    if (event.target.name === 'limit') price = event.target.value;
    if (event.target.name === 'quantity') quantity = event.target.value;
    if (event.target.form?.matches('[data-order-form]')) updateEstimate();
  });

  function stepMarket(automatic = false) {
    if (!view.isConnected || document.hidden) {
      pausePlayback();
      return;
    }
    const keepPlayFocus = document.activeElement?.matches('[data-market-play]');
    historical = false;
    const { filled, expired } = simAccount.advance();
    const messages = [];
    if (filled.length) {
      messages.push(`第 ${filled[0].id} 笔委托以 ${simMoney(filled[0].price)} 成交。`);
      if (filled.length > 1) messages.push(`另有 ${filled.length - 1} 笔成交。`);
    }
    if (simAccount.closed) {
      pausePlayback();
      messages.push(`今天已收盘。${expired.length ? `${expired.length} 笔未成交委托已失效。` : ''}`);
    }
    if (messages.length || !automatic) setStatus(messages.join('') || `模拟行情已推进至 ${simAccount.quote.time}。`);
    let focusTarget = simAccount.closed ? '[data-step="day"]' : '[data-step="tick"]';
    if (automatic && !simAccount.closed) focusTarget = '[data-market-play]';
    if (automatic && !keepPlayFocus) focusTarget = undefined;
    render(focusTarget);
  }

  view.addEventListener('focusin', event => {
    if (!event.target.matches('[data-market-play]')) pausePlayback();
  });
  view.addEventListener('pointerdown', event => {
    if (!event.target.closest('[data-market-play]')) pausePlayback();
  });
  window.addEventListener('hashchange', pausePlayback, { once: true });

  view.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    const action = button.dataset;
    if ('tourOpen' in action) pausePlayback();
    if ('marketPlay' in action) {
      if (playTimer !== null) {
        pausePlayback();
      } else if (!simAccount.closed) {
        historical = false;
        playTimer = setInterval(() => stepMarket(true), 2000);
        document.addEventListener('visibilitychange', pauseWhenHidden);
        render('[data-market-play]');
      }
      return;
    }
    if (action.chartMode) {
      historical = action.chartMode === 'index';
      render(`[data-chart-mode="${action.chartMode}"]`);
      return;
    }
    if ('example' in action) {
      side = 'buy';
      price = '10.00';
      quantity = '100';
      setStatus('');
      render();
      view.querySelector('[name="limit"]').focus();
    }
    if (action.side) {
      side = action.side;
      price = ((side === 'buy' ? simAccount.quote.ask : simAccount.quote.bid) / 100).toFixed(2);
      setStatus('');
      render(`[data-side="${side}"]`);
    }
    if (action.quote) {
      price = (Number(action.quote) / 100).toFixed(2);
      view.querySelector('[name="limit"]').value = price;
      updateEstimate();
      view.querySelector('[name="limit"]').focus();
    }
    if (action.step === 'tick') {
      stepMarket();
    }
    if (action.step === 'day') {
      historical = false;
      const { filled, expired } = simAccount.nextDay();
      setStatus(`现在是第 ${simAccount.day} 个交易日，可卖 ${simAccount.sellable} 股。${filled.length ? `上一日收盘前有 ${filled.length} 笔委托成交。` : ''}${expired.length ? `${expired.length} 笔未成交委托已失效。` : ''}`);
      render('[data-step="day"]');
    }
    if (action.cancel) {
      const order = simAccount.cancel(Number(action.cancel));
      if (!order) return;
      const released = order.side === 'buy' ? `${simMoney(order.amount + order.fee)} 可用资金` : `${order.quantity} 股可卖数量`;
      setStatus(`已撤销第 ${order.id} 笔委托，释放 ${released}。`);
      render('[data-order-form] button[type="submit"]');
    }
  });

  view.addEventListener('submit', event => {
    event.preventDefault();
    if (event.target.matches('[data-reset-form]')) {
      const newBudget = event.target.elements.budget.valueAsNumber;
      if (!Number.isInteger(newBudget) || newBudget < 0 || newBudget > 10000) return;
      simAccount = new SimTradingAccount(newBudget);
      historical = false;
      side = 'buy';
      price = '';
      quantity = '100';
      setStatus(`模拟账户已重置，初始资金 ${simMoney(simAccount.startingCash)}。`);
      render('.sim-reset summary');
      return;
    }
    if (!event.target.matches('[data-order-form]')) return;
    const { order, reason } = simAccount.submit(side, selectedPrice(), Number(quantity));
    if (reason) {
      setStatus(reason, true);
    } else if (order.status === 'filled') {
      setStatus(`${simSide(side)}成交 ${order.quantity} 股，成交价 ${simMoney(order.price)}，费用 ${simMoney(order.fee)}。`);
    } else {
      const explanation = side === 'buy' ? '限价低于卖一' : '限价高于买一';
      setStatus(`${explanation}，委托正在等候。你可以推进行情，也可以撤单。`);
    }
    render('[data-order-form] button[type="submit"]');
  });

  render();
  setupSimulatorTour(root);
}

const simulatorTourKey = 'first-share-simulator-tour-v1';
let simulatorTourSeen = false;

function setupSimulatorTour(root) {
  const shell = root.querySelector('.sim-shell');
  const dialog = document.createElement('dialog');
  dialog.className = 'sim-tour';
  dialog.setAttribute('aria-labelledby', 'sim-tour-title');
  dialog.setAttribute('aria-describedby', 'sim-tour-text');
  dialog.innerHTML = `
    <div class="sim-tour-frame" aria-hidden="true"></div>
    <section class="sim-tour-card">
      <div class="sim-tour-meta"><span>新手引导 <b data-tour-count></b></span><button type="button" class="sim-tour-skip" data-tour-exit>跳过引导</button></div>
      <div class="sim-tour-track" aria-hidden="true"><i></i></div>
      <h2 id="sim-tour-title" tabindex="-1" aria-describedby="sim-tour-text"></h2>
      <p id="sim-tour-text"></p>
      <div class="sim-tour-actions"><button type="button" data-tour-prev>上一步</button><button type="button" data-tour-next>下一步</button></div>
    </section>`;
  shell.append(dialog);
  const card = dialog.querySelector('.sim-tour-card');
  const frame = dialog.querySelector('.sim-tour-frame');
  const title = dialog.querySelector('h2');
  const previous = dialog.querySelector('[data-tour-prev]');
  const next = dialog.querySelector('[data-tour-next]');
  let steps, current, originY, listeners;

  function highlightedElement() {
    const step = steps[current];
    if (step.detail && window.innerHeight < 640) return shell.querySelector(step.detail);
    return shell.querySelector(step.target);
  }

  function positionCard() {
    const rect = highlightedElement().getBoundingClientRect();
    const width = dialog.clientWidth;
    const height = dialog.clientHeight;
    const gap = 14;
    const margin = 10;
    const cardWidth = card.offsetWidth;
    const cardHeight = card.offsetHeight;
    const clamp = (n, max) => Math.max(margin, Math.min(n, max - margin));
    let left = clamp(rect.left, width - cardWidth);
    let top;
    if (rect.right + gap + cardWidth <= width - margin) {
      left = rect.right + gap;
      top = clamp(rect.top, height - cardHeight);
    } else if (rect.left - gap - cardWidth >= margin) {
      left = rect.left - gap - cardWidth;
      top = clamp(rect.top, height - cardHeight);
    } else if (rect.bottom + gap + cardHeight <= height - margin) {
      top = rect.bottom + gap;
    } else if (rect.top >= gap + cardHeight + margin) {
      top = rect.top - gap - cardHeight;
    } else {
      top = height - cardHeight - margin;
    }
    card.style.left = left + 'px';
    card.style.top = clamp(top, height - cardHeight) + 'px';
    frame.style.left = rect.left - 3 + 'px';
    frame.style.top = rect.top - 3 + 'px';
    frame.style.width = rect.width + 6 + 'px';
    frame.style.height = rect.height + 6 + 'px';
  }

  function showStep(index) {
    current = index;
    const step = steps[index];
    dialog.querySelector('[data-tour-count]').textContent = `${index + 1} / ${steps.length}`;
    dialog.querySelector('.sim-tour-track i').style.width = `${100 * (index + 1) / steps.length}%`;
    title.textContent = step.title;
    dialog.querySelector('#sim-tour-text').textContent = step.text;
    previous.disabled = index === 0;
    next.textContent = index === steps.length - 1 ? '完成引导' : '下一步';
    const header = document.querySelector('.top');
    const headerHeight = getComputedStyle(header).position === 'sticky' ? header.offsetHeight : 0;
    const target = highlightedElement();
    window.scrollBy({ top: target.getBoundingClientRect().top - headerHeight - 16, behavior: 'instant' });
    positionCard();
    card.scrollTop = 0;
    title.focus({ preventScroll: true });
  }

  function openTour() {
    if (!shell.isConnected || dialog.open) return;
    steps = simulatorTourSteps.filter(step => shell.querySelector(step.target));
    if (!steps.length) return;
    originY = window.scrollY;
    dialog.showModal();
    showStep(0);
    listeners = new AbortController();
    const options = { signal: listeners.signal };
    window.addEventListener('resize', positionCard, options);
    window.addEventListener('scroll', positionCard, { ...options, passive: true });
    window.addEventListener('hashchange', () => listeners.abort(), options);
  }

  function finishTour() {
    listeners.abort();
    simulatorTourSeen = true;
    try { localStorage.setItem(simulatorTourKey, 'seen'); } catch { /* Remember within this visit. */ }
    dialog.close();
    window.scrollTo({ top: originY, behavior: 'instant' });
    shell.querySelector('[data-tour-open]').focus({ preventScroll: true });
  }

  function advance() {
    if (current === steps.length - 1) finishTour();
    else showStep(current + 1);
  }

  shell.addEventListener('click', event => {
    if (event.target.closest('[data-tour-open]')) openTour();
  });
  previous.addEventListener('click', () => showStep(current - 1));
  next.addEventListener('click', advance);
  dialog.querySelector('[data-tour-exit]').addEventListener('click', finishTour);
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    finishTour();
  });
  dialog.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.key === 'ArrowLeft' && current > 0) {
      event.preventDefault();
      showStep(current - 1);
    } else if (event.key === 'ArrowRight' && current < steps.length - 1) {
      event.preventDefault();
      showStep(current + 1);
    }
  });
  try { simulatorTourSeen ||= localStorage.getItem(simulatorTourKey) === 'seen'; } catch { /* Use memory. */ }
  if (!simulatorTourSeen) requestAnimationFrame(openTour);
}

function practiceQuote(account) {
  const order = account.orders[0];
  const { ask, bid } = account.quote;
  return `<dl class="practice-ledger">
    <div><dt>卖一 · 最低卖价</dt><dd>${simMoney(ask)}</dd></div>
    <div><dt>买一 · 最高买价</dt><dd>${simMoney(bid)}</dd></div>
    <div><dt>${order ? '我的委托' : '虚拟可用资金'}</dt><dd class="practice-order-mark">${order ? SIM_ORDER_STATUS[order.status] : simMoney(account.available)}</dd></div>
  </dl>`;
}

function renderPractice(root, type, { onDone, onStory, onFull, nextLabel = '继续故事' } = {}) {
  const steps = PRACTICE_STEPS[type];
  if (!Array.isArray(steps)) return;
  const account = type === 'quote' || type === 'money' ? new SimTradingAccount(8000) : null;
  let stepIndex = 0;
  let complete = false;
  let feedback = '';
  let isHint = false;

  root.innerHTML = `<section class="practice practice-${type}" aria-labelledby="practice-title"><div class="practice-live" aria-live="polite" aria-atomic="true"></div><div class="practice-view"></div></section>`;
  const view = root.querySelector('.practice-view');
  const live = root.querySelector('.practice-live');

  function draw(focusTarget) {
    const step = steps[stepIndex];
    const result = complete ? 'complete' : isHint ? 'retry' : feedback ? 'advance' : 'ready';
    const choices = step.actions.map((action, index) =>
      `<button class="practice-choice" type="button" data-practice-choice="${index}">${action}<span class="practice-arrow" aria-hidden="true">↗</span></button>`).join('');
    const storyButton = `<button class="practice-choice practice-primary" type="button" data-practice-nav="story">${nextLabel} <span aria-hidden="true">→</span></button>`;
    const fullButton = onFull
      ? '<button class="practice-choice" type="button" data-practice-nav="full">进入完整模拟盘</button>' : '';
    view.innerHTML = `<div class="practice-main" data-practice-state="${result}">
        <p class="practice-kicker">动手试一试${steps.length > 1 ? ` <span>${stepIndex + 1} / ${steps.length}</span>` : ''}</p>
        <h2 id="practice-title" tabindex="-1">${step.title}</h2>
        <p class="practice-description">${step.description}</p>
        <div class="practice-figure">${step.figure(account)}</div>
        <div class="practice-dock">
          ${feedback ? `<p class="practice-feedback${isHint ? ' practice-hint' : ''}">${feedback}</p>` : ''}
          <div class="practice-actions">${complete ? `${storyButton}${fullButton}` : choices}</div>
        </div>
    </div>`;
    if (focusTarget) view.querySelector(focusTarget)?.focus({ preventScroll: true });
  }

  view.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    const { practiceNav, practiceChoice } = button.dataset;
    if (practiceNav === 'story') onStory?.(type);
    if (practiceNav === 'full') onFull?.(type);
    if (practiceChoice === undefined || complete) return;

    const step = steps[stepIndex];
    let focusTarget = `[data-practice-choice="${practiceChoice}"]`;
    isHint = Number(practiceChoice) !== step.correct;
    if (isHint) {
      feedback = step.hint;
    } else {
      feedback = step.next ? step.next(account) : step.success;
      complete = stepIndex === steps.length - 1;
      if (complete) focusTarget = '[data-practice-nav="story"]';
      else {
        stepIndex += 1;
        focusTarget = '#practice-title';
      }
    }
    live.textContent = feedback;
    draw(focusTarget);
    if (complete) onDone?.(type);
  });
  draw();
}
</script>

    if (Array.isArray(saved)) {
      saved.forEach(slug => {
        if (strategyLessons.some(lesson => lesson.slug === slug)) strategyCompleted.add(slug);
      });
    }
  } catch { /* Keep this page usable when storage is unavailable. */ }
}

function strategyProgress() {
  readStrategyProgress();
  const next = strategyLessons.find(lesson => !strategyCompleted.has(lesson.slug));
  return { completed: strategyCompleted.size, total: strategyLessons.length, nextSlug: next?.slug ?? null };
}

function completeStrategyLesson(slug) {
  readStrategyProgress();
  strategyCompleted.add(slug);
  try { localStorage.setItem(strategyStorageKey, JSON.stringify([...strategyCompleted])); }
  catch { /* This session can continue in memory. */ }
}

function strategyLedger(rows) {
  return '<dl class="strategy-ledger">' + rows.map(([term, value]) =>
    `<div><dt>${term}</dt><dd>${value}</dd></div>`).join('') + '</dl>';
}

function allocationBar(percent, label, rest) {
  return `<div class="strategy-allocation" aria-hidden="true"><i style="width:${percent}%"></i></div>
    <div class="strategy-legend"><span><i></i>${label}</span><span>${rest}</span></div>`;
}

function securityLab(index) {
  const cards = [
    ['股东', '公司股权', '按持股比例享有股东权利。', '可能收到分红，也可能以更高或更低的价格卖出。', '公司经营恶化时，股东可能损失全部投入。'],
    ['债权人', '国家债权', '按发行条款享有还本付息的权利。', '例如面值 100 元、年票息 2% 的固定利率国债，每年票息 2 元。', '记账式国债到期前在市场卖出，价格会随市场利率波动。'],
    ['份额持有人', '一份投资组合', '按份额分享合同约定的组合收益并承担风险。', '底层资产变化会影响净值，部分基金按合同分红。', '股票基金和债券基金都可能亏损，持有什么决定主要风险。'],

}

function fundLab(index) {

    <p class="strategy-note">这是单一持仓下跌的简化情景，未计费用。若多个持仓一起跌，整个组合也会受到影响。</p>`;
}

function boardLab(index) {

function screenLab(index) {
  const comparisons = [
    [['营收同比', '+12%', '+32%'], ['净利润', '800 万元', '900 万元'], ['经营现金净流入', '860 万元', '140 万元']],
    [['股价', '20 元', '12 元'], ['每股收益', '1 元', '1 元'], ['市盈率', '20 倍', '12 倍']],
